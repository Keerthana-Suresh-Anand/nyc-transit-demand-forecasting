name: CI & Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

# Supersede stale PR runs (each new push cancels the previous run for that ref),
# but never cancel a main-branch run mid-flight so an in-progress image publish
# always completes. Grouped per-ref so PRs and main don't interrupt each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # dashboard extra: lets test_dashboard_imports.py resolve app.py's imports
      - name: Install dependencies
        run: pip install -e ".[pipeline,dashboard,dev]"

      - name: Lint
        run: ruff check src/ tests/ pipelines/

      - name: Unit tests
        run: pytest tests/unit/ -v --tb=short

      - name: Integration tests
        run: pytest tests/integration/ -v --tb=short

  build-and-push:
    needs: lint-and-test
    # Publish only from main: without the ref check, a manual workflow_dispatch from
    # a feature branch would push :latest/:stable images built from unmerged code.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Tag semantics:
      #   :<sha>    immutable, one per commit — the reproducibility anchor
      #   :latest   newest build (moving pointer, informational)
      #   :stable   what the scheduled pipelines actually run — promoted here only
      #             after lint + unit tests pass. Rollback: retag an older sha as
      #             stable (docker buildx imagetools create -t ...:stable ...:<sha>)
      #             without touching latest or waiting for a new build.
      - name: Build and push pipeline image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.pipeline
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nyc-transit-pipeline:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nyc-transit-pipeline:stable
            ${{ secrets.DOCKERHUB_USERNAME }}/nyc-transit-pipeline:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push dashboard image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.dashboard
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nyc-transit-dashboard:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nyc-transit-dashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
